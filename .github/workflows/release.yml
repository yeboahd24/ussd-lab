name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
          - target: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X main.version=${VERSION} \
            -X main.commit=${COMMIT} \
            -X main.date=${DATE}"
          go build -ldflags "${LDFLAGS}" -o "dist/ussd-${{ matrix.target }}" ./cmd/ussd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ussd-${{ matrix.target }}
          path: dist/ussd-${{ matrix.target }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package
        run: |
          cd dist
          for f in ussd-*; do
            if [[ "$f" == *windows* ]]; then
              mv "$f" "$f.exe"
              zip "$f.zip" "$f.exe"
            else
              chmod +x "$f"
              tar -czf "$f.tar.gz" "$f"
            fi
          done
          ls -la

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz, dist/*.zip
          generate_release_notes: true
